<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220" fill="none">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2878FF" />
      <stop offset="50%" stop-color="#7650F5" />
      <stop offset="100%" stop-color="#D13BDE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing Aura -->
  <rect x="25" y="25" width="170" height="170" rx="42" fill="#00D5E9" opacity="0.25" filter="url(#glow)"/>

  <!-- Icon Badge -->
  <rect x="30" y="30" width="160" height="160" rx="38" fill="url(#badgeGrad)"/>

  <!-- Futuristic Geometric 'N' & Tech Pillars -->
  <rect x="65" y="65" width="20" height="90" rx="6" fill="#FFFFFF"/>
  <rect x="135" y="65" width="20" height="90" rx="6" fill="#00D5E9"/>
  <polygon points="85,70 135,120 135,95 85,95" fill="#FFFFFF" opacity="0.95"/>

  <!-- Wordmark -->
  <text x="220" y="115" font-family="'Segoe UI', 'Cairo', sans-serif" font-weight="800" font-size="74" fill="#FFFFFF" letter-spacing="3">NEXORA</text>
  <text x="225" y="160" font-family="'Segoe UI', 'Cairo', sans-serif" font-weight="600" font-size="22" fill="#00D5E9" letter-spacing="1">Smart Replies. Smarter Business.</text>
</svg>

